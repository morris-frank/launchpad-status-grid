# golangci-lint v2: soilytix/mario's linter set, at this repository's size.
version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - noctx
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # The board's rules hold no terminal, no device and no network: the
        # adapters implement app's ports, and cmd/ wires them.
        domain:
          files:
            - "**/internal/launchpad/domain/**"
          deny:
            - pkg: "github.com/morris-frank/launchpad-status-grid/internal/launchpad/app"
              desc: "domain is below app"
            - pkg: "github.com/morris-frank/launchpad-status-grid/internal/launchpad/adapter"
              desc: "domain imports no adapter"
            - pkg: "charm.land"
              desc: "no terminal library in domain"
            - pkg: "net/http"
              desc: "domain does no I/O"
        app:
          files:
            - "**/internal/launchpad/app/**"
          deny:
            - pkg: "github.com/morris-frank/launchpad-status-grid/internal/launchpad/adapter"
              desc: "app declares ports; adapters implement them"
            - pkg: "charm.land"
              desc: "no terminal library in app"
            - pkg: "net/http"
              desc: "the worker is an adapter"
        no-mario:
          files:
            - "$all"
          deny:
            - pkg: "github.com/Soilytix/mario"
              desc: "this repository depends on none of mario's code; the worker's API is the contract"
